<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ALKÉ Network</title>
    <!-- Older invite links (alke.network/join/CODE) land here with a 404; apps
         that still read 404 pages (Facebook, X) get the invite preview. -->
    <meta name="description" content="You're invited to the ALKÉ Network. The Genesis allocation is open: drill your daily share of ALKE for free. No purchase, no wallet. Post-quantum mainnet in development. No guarantees." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ALKÉ Network" />
    <meta property="og:title" content="⛏️ Drill ALKE for free · ALKÉ Network" />
    <meta property="og:description" content="You're invited. The Genesis allocation is open: drill your daily share of ALKE for free. No purchase, no wallet. Post-quantum mainnet in development. No guarantees." />
    <meta property="og:image" content="https://alke.network/og/join.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://alke.network/og/join.png" />
    <!--
      GitHub Pages serves this for any unknown path (deep links to SPA routes).
      Encode the intended path into a query string and redirect to index.html,
      where the inline script in index.html decodes it back into history.
      https://github.com/rafgraph/spa-github-pages
    -->
    <script>
      var l = window.location;
      l.replace(
        l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
        l.pathname.split("/").slice(0, 1).join("/") + "/?redirect=" +
        encodeURIComponent(l.pathname.slice(1) + l.search + l.hash)
      );
    </script>
  </head>
  <body></body>
</html>
