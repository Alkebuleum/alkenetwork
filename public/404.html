<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alké Network</title>
    <!--
      GitHub Pages serves this for any unknown path (deep links to SPA routes).
      Encode the intended path into a query string and redirect to index.html,
      where the inline script in index.html decodes it back into history.
      https://github.com/rafgraph/spa-github-pages
    -->
    <script>
      var l = window.location;
      l.replace(
        l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
        l.pathname.split("/").slice(0, 1).join("/") + "/?redirect=" +
        encodeURIComponent(l.pathname.slice(1) + l.search + l.hash)
      );
    </script>
  </head>
  <body></body>
</html>
