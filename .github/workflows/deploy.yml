name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Set the repository variable SHOW_LIVE to 1 (GitHub → Settings → Secrets and variables →
          # Actions → Variables) to show the Live global activity section.
          VITE_SHOW_LIVE: ${{ vars.SHOW_LIVE }}
      # One-click download for alke.network/brand: zip the kit (public/brand-kit) into the build.
      - name: Zip the brand kit
        run: |
          mkdir -p "$RUNNER_TEMP/kit"
          cp -r public/brand-kit "$RUNNER_TEMP/kit/ALKE-Network-Brand-Kit"
          (cd "$RUNNER_TEMP/kit" && zip -rq -X "$GITHUB_WORKSPACE/dist/brand-kit/ALKE-Network-Brand-Kit.zip" ALKE-Network-Brand-Kit)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
